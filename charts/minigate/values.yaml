replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/ehsanmsb/minigate
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.appVersion.
imagePullSecrets: []

# Create this Secret separately with a config.yaml key containing S3 credentials.
existingSecret: ""
logLevel: WARN

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  metricsPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: ""

# OpenShift Route. The router's default certificate must cover the assigned host.
route:
  enabled: false
  host: "" # Leave empty to let OpenShift assign a hostname.
  annotations: {}
  tls:
    enabled: true # Edge TLS with HTTP-to-HTTPS redirect.

# Contour HTTPProxy requires the projectcontour.io CRD and a Contour controller.
httpProxy:
  enabled: false
  fqdn: ""
  tlsSecretName: "" # Optional TLS Secret in the release namespace.

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http
terminationGracePeriodSeconds: 35

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

serviceMonitor:
  enabled: false
  additionalLabels: {}
  interval: 30s

nodeSelector: {}
tolerations: []
affinity: {}
