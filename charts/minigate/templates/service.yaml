apiVersion: v1
kind: Service
metadata:
  name: {{ include "minigate.fullname" . }}
  labels:
    {{- include "minigate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
  selector:
    app.kubernetes.io/name: minigate
    app.kubernetes.io/instance: {{ .Release.Name }}
