{{- if not .Values.existingSecret }}
{{- fail "existingSecret must name a Secret containing config.yaml" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minigate.fullname" . }}
  labels:
    {{- include "minigate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: minigate
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "minigate.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 35
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: minigate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/minigate/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/minigate
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.existingSecret | quote }}
            items:
              - key: config.yaml
                path: config.yaml
