name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/minigate
      - uses: azure/setup-helm@v5
      - run: helm lint charts/minigate --set existingSecret=minigate-config
      - name: Check Helm chart defaults and options
        run: |
          helm template minigate charts/minigate --set existingSecret=minigate-config > /tmp/minigate-default.yaml
          ! grep -Eq '^kind: (Ingress|Route|HTTPProxy|ServiceMonitor|HorizontalPodAutoscaler|PodDisruptionBudget|ServiceAccount)$' /tmp/minigate-default.yaml
          helm template minigate charts/minigate --set existingSecret=minigate-config --set autoscaling.enabled=true --set podDisruptionBudget.enabled=true --set serviceAccount.create=true --set ingress.enabled=true --set ingress.host=files.example.com --set ingress.tlsSecretName=files-tls --set serviceMonitor.enabled=true > /dev/null
          helm template minigate charts/minigate --set existingSecret=minigate-config --set route.enabled=true > /tmp/minigate-route.yaml
          grep -q '^kind: Route$' /tmp/minigate-route.yaml
          helm template minigate charts/minigate --set existingSecret=minigate-config --set httpProxy.enabled=true --set httpProxy.fqdn=files.example.com --set httpProxy.tlsSecretName=files-tls > /tmp/minigate-httpproxy.yaml
          grep -q '^kind: HTTPProxy$' /tmp/minigate-httpproxy.yaml
          grep -q 'response: "20s"' /tmp/minigate-httpproxy.yaml
      - if: github.event_name == 'pull_request'
        run: docker build -t minigate:ci .

  release:
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: minigate-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/ehsanmsb/minigate
        run: |
          npx --yes \
            -p semantic-release@25 \
            -p @semantic-release/commit-analyzer@13 \
            -p @semantic-release/release-notes-generator@14 \
            -p @semantic-release/exec@7 \
            -p @semantic-release/github@12 \
            -p conventional-changelog-conventionalcommits@8 \
            semantic-release
